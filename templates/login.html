<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="card">
      <h1>Welcome back</h1>
      <p>Enter any username and password to continue.</p>
      <form action="{{ url_for('login_submit') }}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter any username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter any password" required />

        <button type="submit">Log in</button>
      </form>
    </main>
  </body>
</html>
